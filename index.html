<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Hover — HTML e CSS</title>


  <link rel="stylesheet" href="estilo.css">
</head>


<body>
  <h1><span>Meus</span> aplicativos</h1>
  <p>Passe o mouse sobre os cartões ou use a tecla Tab.</p>


  <main class="container">


    <article class="card" tabindex="0"
      style="--cor: #0d9700;">
      <div class="frente">
        <span class="icone" aria-hidden="true">wa</span>
      </div>


      <div class="verso">
        <h2>whatsapp</h2>
        <p>Mande mensagem para seus amigos e muito mais.</p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #0340f7;">
      <div class="frente">
        <span class="icone" aria-hidden="true">dc</span>
      </div>


      <div class="verso">
        <h2>discord</h2>
        <p>Faça ligaçoes com seus amigos e jogue juntos.</p>
      </div>
    </article>


    <article class="card" tabindex="0"
      style="--cor: #fb6502;">
      <div class="frente">
        <span class="icone" aria-hidden="true">sh</span>
      </div>


      <div class="verso">
        <h2>Shopee</h2>
        <p>Site de compras de perifericos acessorios roupas e muito mais.</p>
      </div>
    </article>


  </main>
</body>
</html>
